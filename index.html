<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retirement Counter</title>
  <meta name="description" content="Log educational and retire days, and count down to January 1st.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Retirement Counter</h1>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" role="tab" class="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" class="tab" data-tab="history" aria-selected="false">History</button>
    </nav>

    <div id="panel-today" role="tabpanel">
    <section class="card">
      <h2>What kind of day was it?</h2>
      <input id="day" type="date" aria-label="Day to log">
      <div class="choices">
        <button type="button" class="choice" data-type="educational">📚<span>Educational day</span></button>
        <button type="button" class="choice" data-type="retire">🌴<span>Retire day</span></button>
      </div>
      <p id="status" class="muted" aria-live="polite"></p>
    </section>

    <section class="stats">
      <div class="stat"><strong id="count-educational">0</strong><span>educational days</span></div>
      <div class="stat"><strong id="count-retire">0</strong><span>retire days</span></div>
    </section>
    <p class="muted small" id="stats-label"></p>

    <section class="card">
      <h2 id="countdown-title">Countdown to January 1</h2>
      <div class="units">
        <div class="unit"><span id="days">0</span><label>days</label></div>
        <div class="unit"><span id="hours">00</span><label>hours</label></div>
        <div class="unit"><span id="minutes">00</span><label>minutes</label></div>
        <div class="unit"><span id="seconds">00</span><label>seconds</label></div>
      </div>
      <p class="weekdays"><strong id="weekdays-left">0</strong> weekdays left</p>
      <div class="target">
        <label for="target">Count down to</label>
        <input id="target" type="date">
        <button type="button" id="reset-target" hidden>Reset to January 1</button>
      </div>
    </section>

    </div>

    <div id="panel-history" role="tabpanel" hidden>
      <section class="card">
        <div class="month-nav">
          <button type="button" id="prev-month" aria-label="Previous month">‹</button>
          <h2 id="month-title"></h2>
          <button type="button" id="next-month" aria-label="Next month">›</button>
        </div>
        <div class="calendar" id="calendar"></div>
        <p class="muted small legend">
          <span class="swatch educational"></span> Educational
          <span class="swatch retire"></span> Retire
          <span class="swatch none"></span> No choice
        </p>
        <p class="muted small" id="month-summary"></p>
      </section>

      <section class="card" id="editor" hidden>
        <h2 id="editor-title"></h2>
        <div class="choices three">
          <button type="button" class="edit-choice" data-type="educational">📚<span>Educational</span></button>
          <button type="button" class="edit-choice" data-type="retire">🌴<span>Retire</span></button>
          <button type="button" class="edit-choice" data-type="">➖<span>No choice</span></button>
        </div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
